name: backend application build and test

on:
  push:
    branches: main

jobs:
  cuild-and-test-job:
    runs-on: ubuntu-latest
    steps:
      - name: code checkout pannu
        uses : action/checkout@v7
        name: Image build docker
        uses: docker build -t siddhukaviya/ramaya:gita
        name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USER_NAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        